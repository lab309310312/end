<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc">
  <div class="screen">
    <div id="history"></div>
    <div id="display">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="back">DEL</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="/">&divide;</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">&times;</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">&minus;</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-num="0" class="zero">0</button><button data-act="dot">.</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
