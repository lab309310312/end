<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networking Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="quiz">
  <section id="start" class="screen">
    <h1>Networking Quiz</h1>
    <p>5 questions. 15 seconds each.</p>
    <button id="startBtn" class="primary">Start quiz</button>
  </section>

  <section id="game" class="screen" hidden>
    <div class="meta">
      <span id="progress">Question 1 of 5</span>
      <span id="timer">15</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback" role="status"></p>
    <button id="next" class="primary" hidden>Next</button>
  </section>

  <section id="result" class="screen" hidden>
    <h1>Your score</h1>
    <p id="score"></p>
    <p id="grade"></p>
    <button id="again" class="primary">Try again</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
